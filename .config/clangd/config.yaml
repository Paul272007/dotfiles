CompileFlags:
  Add:
    # - -I/path/to/custom/include
    - -Wall
    - -Wextra
    - -Wpedantic
    - -Wshadow
    - -Wformat=2
    - -Wnull-dereference
    - -Wconversion
    - -Wsign-conversion
    - -Wdouble-promotion
    - -Wuninitialized
    - -Wunused-label
    - -Wnon-virtual-dtor
    - -Wold-style-cast
    - -Woverloaded-virtual
    - -Wno-comment

---

If:
  PathMatch: .*\.c$
CompileFlags:
  Add: [-std=c17]

---

If:
  PathMatch: .*\.(cpp|cc|cxx|hpp|hh|hxx|h)$
CompileFlags:
  Add: [-std=c++23]

Diagnostics:
  # Suppress warnings from external libraries (e.g., /usr/include)
  UnusedIncludes: Strict
  # clang-tidy configuration
  ClangTidy:
    Add: [
      "bugprone-*",                     # Detect error-prone code patterns
      "performance-*",                  # Suggestions to optimize speed and memory
      "portability-*",                  # Portability issues across OS/compilers
      "readability-*",                  # Style and readability improvements
      "modernize-*",                    # (C++) Enforce modern language syntax
      "cert-*",                         # CERT security standard rules
      "cppcoreguidelines-*",            # C++ Core Guidelines rules
      # Extra checks
      "google-default-arguments",
      "google-runtime-operator",
      "hicpp-exception-baseclass",
      "hicpp-multiway-paths-covered",
      "misc-misplaced-const",
      "misc-new-delete-overloads",
      "misc-non-copyable-objects",
      "misc-throw-by-value-catch-by-reference",
      "misc-unconventional-assign-operator",
      "misc-uniqueptr-reset-release",
      "openmp-use-default-none",
    ]
    Remove: [
      "bugprone-easily-swappable-parameters",                               # Allow consecutive parameters of the same type
      "modernize-use-trailing-return-type",                                 # Do not enforce trailing return types
      "readability-braces-around-statements",                               # Do not require braces around single-line statements
      "readability-identifier-length",                                      # Allow short variable names (under 3 chars)
      "readability-implicit-bool-conversion",                               # Convenient for C functions returning int
      "cppcoreguidelines-non-private-member-variables-in-classes",          # Allow protected class member variables
      "cppcoreguidelines-avoid-const-or-ref-data-members",                  # Allow const or reference class members
      "cppcoreguidelines-avoid-magic-numbers", "readability-magic-numbers", # Allow magic numbers
      "cppcoreguidelines-macro-usage",                                      # Allow macros (e.g., X-macros)
      "cppcoreguidelines-avoid-do-while",                                   # Allow do {} while ()
      "cppcoreguidelines-pro-type-static-cast-downcast",                    # Allow explicit static_cast downcasts
      "cppcoreguidelines-pro-bounds-pointer-arithmetic",                    # Allow pointer arithmetic
      "cppcoreguidelines-avoid-c-arrays",                                   # Allow C-style arrays[n]
      "modernize-avoid-c-arrays",                                           # Same as above
      # "performance-avoid-endl",                                             # Sometimes std::endl is useful
      "cppcoreguidelines-avoid-goto",                                       # Allow goto when appropriate
    ]
