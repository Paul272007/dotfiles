# Fonts
# font_family      Geist Mono Nerd Font
font_family       JetBrains Mono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         12

# Window
hide_window_decorations yes
background_opacity      0.5
window_padding_width      5
confirm_os_window_close   0

# --- Theme and colors
background           #1a1a1a
foreground           #e1ead5
selection_background #33467C
selection_foreground #c0caf5
cursor               #c0caf5
cursor_text_color    #1a1b26

# Black/Gray => background / comments
color0               #15161E
color8               #414868
# Red => errors / deletions
color1               #c86050
color9               #c86050
# Green => success / additions
color2               #8faa74
color10              #8faa74
# Yellow => warnings
color3               #d4a85a
color11              #d4a85a
# Blue => functions / folders
color4               #7a9ab0
color12              #7a9ab0
# Magenta/Purple => keywords / constants
color5               #a08898
color13              #a08898
# Light cyan => types / operators
color6               #7aaa90
color14              #7aaa90
# Gray/White => regular text
color7               #e0d0ba
color15              #e1eab5
