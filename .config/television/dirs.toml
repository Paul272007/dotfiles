[metadata]
# Must stay "dirs" so `tv dirs` works
name = "dirs"
description = "Navigate directories"

[source]
# Use sh -c so && is interpreted by the shell
command = "sh -c 'echo \".\" && fd --type d --hidden --exclude .git'"

[preview]
# Directory preview using eza (optional)
command = "eza --icons=always --hyperlink --git --classify --group-directories-first -lh '{}'"

[keybindings]
ctrl-e = "actions:cd"

[actions.cd]
command = "cd '{}'"
mode = "execute"
