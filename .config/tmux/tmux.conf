# ==========================================
# Keybinds
# ==========================================
# Leader key = Ctrl + A
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# kill window with prefix + k
unbind k
bind k kill-window
# split right with prefix + m
unbind %
unbind m
bind m split-window -h
# split bottom with prefix + m
unbind '"'
unbind l
bind l split-window

# new window with prefix + tab
unbind tab
bind tab new-window

## Copy mode
# Enable vim keybinds
unbind c
bind c copy-mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf; display-message "Configuration reloaded."
# Show menu
set -g @menus_trigger 'Space'
# Mouve between windows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n C-PageUp previous-window
bind -n C-PageDown next-window

# Enable mouse
set -g mouse on

# Réduire le délai de la touche Échap pour Neovim
set-option -sg escape-time 10

# Permettre à Neovim de détecter quand le terminal gagne/perd le focus
set-option -g focus-events on

# don't rename windows automatically
set-option -g allow-rename off

# first window is number one
set -g base-index 1

# status bar on top
set-option -g status-position top

# Configure the catppuccin plugin
set -g default-terminal "tmux-256color"
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# ==========================================
# Plugins
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tpope/vim-obsession'
set -g @plugin 'lost-melody/tmux-command-palette'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'jaclu/tmux-menus'

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Configure session restoration
set -g @continuum-restore 'on'    # Restaure automatiquement la dernière session au démarrage
set -g @continuum-save-interval '5' # Sauvegarde toutes les 5 minutes

# Permet de restaurer les sessions Neovim si tu as le plugin 'tpope/vim-obsession'
set -g @resurrect-strategy-nvim 'session'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TPM and theme
run '~/.tmux/plugins/tpm/tpm'
