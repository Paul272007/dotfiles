# --- Keybinds

# Leader key = Ctrl + Q
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# prefix + k : kill window
unbind k
bind k kill-window
# prefix + m : split right
unbind m
bind m split-window -h
# prefix + l : split bottom
unbind l
bind l split-window
# prefix + tab : new window
unbind tab
bind tab new-window
# prefix + r : reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf; display-message " Configuration reloaded."
# prefix + c : copy mode
unbind c
bind c copy-mode

# Move between panes with Alt+arrows or Alt+vim motions
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Move between windows
bind -n C-PageUp previous-window
bind -n C-PageDown next-window

# --- Popup keybinds

# Open lazygit
bind C-l display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
# Create new session
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
# Switch between sessions
bind C-p display-popup -E "tmux list-sessions -F '#S' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
# Terminal
bind C-t display-popup \
  -b rounded \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "zsh"
# Dotfiles menu
bind a display-menu -T "#[align=centre]>>> Dotfiles <<<" -x C -y C \
  "Shell config"            s  "display-popup -d ~/dotfiles -w 80% -h 80% -E 'nvim ~/dotfiles/.config/rc/rc'" \
  "Tmux config"             t  "display-popup -d ~/dotfiles -w 80% -h 80% -E 'nvim ~/dotfiles/.config/tmux/tmux.conf'" \
  "Nvim LSP config"         l  "display-popup -d ~/dotfiles -w 80% -h 80% -E 'nvim ~/dotfiles/.config/nvim/lua/core/lsp.lua'" \
  "Nvim Keymaps config"     k  "display-popup -d ~/dotfiles -w 80% -h 80% -E 'nvim ~/dotfiles/.config/nvim/lua/core/keymaps.lua'" \
  "Exit"                    q  ""

# --- Options

set-window-option -g mode-keys vi                         # Enable vim motions for copy mode
bind -T copy-mode-vi v send -X begin-selection            # Begin selection with v
bind -T copy-mode-vi y send -X copy-selection-and-cancel  # Copy selection with y

set -g @menus_trigger 'Space'                             # Space to show menus
set -g @continuum-restore 'on'                            # Automatically restore last session when booting
set -g @continuum-save-interval '5'                       # Save every 5 minutes
set -g @resurrect-strategy-nvim 'session'                 # Restore nvim sessions

set -g mouse on                                           # Enable mouse
set -g base-index 1                                       # First window is number one
set -g pane-base-index 1                                  # First pane is number one
set-option -g focus-events on                             # Allows neovim to detect when the terminal obtains/loses focus
set-option -g allow-rename off                            # Don't rename windows automatically
set-option -g status-position top                         # Status bar on top
set-option -g renumber-windows on                         # Renumber windows
set-option -sg escape-time 10                             # Reduce the delay after sending the Esc key for neovim

# --- Plugins

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'                     # Tmux plugin manager
set -g @plugin 'tmux-plugins/tmux-resurrect'          # Restore tmux environment after system restart.
set -g @plugin 'tmux-plugins/tmux-continuum'          # Continuous saving of tmux environment + automatic restore when tmux is started
set -g @plugin 'tpope/vim-obsession'                  # Also save vim sessions
set -g @plugin 'lost-melody/tmux-command-palette'     # Show command palette with keybinds in FZF
set -g @plugin 'wfxr/tmux-fzf-url'                    # FZF with urls on the window
set -g @plugin 'jaclu/tmux-menus'                     # Main menu
# set -g @plugin '~/.config/tmux/plugins/desert'        # Custom plugin

run-shell ~/.config/tmux/plugins/desert/desert.tmux

# Launch TPM
run '~/.tmux/plugins/tpm/tpm'
