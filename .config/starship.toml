add_newline = true

[line_break]
disabled = false

# On utilise des formats simples pour éviter les bugs d'affichage Bash
format = """
$directory\
$git_branch\
$git_status\
$character
"""

[directory]
style = "blue"
read_only = " 🔒" # Si l'icône de verrou de nvim marche, garde celle-ci

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[git_branch]
symbol = " "
style = "bold purple"
