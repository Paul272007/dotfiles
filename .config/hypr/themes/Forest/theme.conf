general {
  col.active_border = rgba(899986ff) rgba(526652ff) 45deg
  col.inactive_border = rgba(324432ff)

  gaps_in = 7
  gaps_out = 7, 15, 15, 15
}

decoration {
  rounding = 12

  active_opacity = 1.0
  inactive_opacity = 1.0
}

layerrule {
    name = waybar_blur
    match:namespace = ^(waybar)$
    blur = true
    ignore_alpha = 0.5
}

$terminal = kitty
font_family = Geist Mono Nerd Font
