add_newline     = true
command_timeout = 200
format          = "$directory $git_branch$git_status$character"
right_format    = "$status $username$hostname"

[status]
disabled = false
style    = "bold bright-black"
symbol   = "exit code "
format   = "[$symbol$status]($style)"

[username]
show_always = true
format      = "[$user](bright-black)"

[hostname]
ssh_only = false
format   = "[@$hostname](bright-black)"

[character]
error_symbol   = "[✗](bold red)"
success_symbol = "[❯](red)"
# success_symbol = "[󰣇](bold red)"

[directory]
style             = "bold red"
format            = "[$path]($style)$read_only"
truncation_length = 3
truncation_symbol = "…/"
read_only         = " 󰌾"
read_only_style   = "bold red"
# repo_root_format  = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic red"

[git_status]
style      = "bold red"
format     = "[$all_status]($style)"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
modified   = " "
untracked  = "? "
deleted    = "! "
stashed = ""
staged  = ""
renamed = ""
