# programs
$hypr = ~/.config/hypr
$hyprland = $hypr/hyprland
$fileManager = nautilus
$menu = rofi -show drun -show-icons
$browser = app.zen_browser.zen
$theme = 'Default'
# Créer un launcher personnalisé pour rofi

# Environment variables

env = XCURSOR_THEME,macOs
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,i965
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_THEME,Granite
env = COLOR_THEME,prefer-dark

# Theme
source = $hyprland/current_theme.conf

# Sources
source = $hyprland/monitors.conf
source = $hyprland/keybinds.conf
source = $hyprland/windowrules.conf
source = $hyprland/execs.conf
source = $hyprland/settings.conf
