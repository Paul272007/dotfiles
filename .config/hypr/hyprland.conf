# programs
$fileManager = nautilus
$menu = rofi -show drun -show-icons
$browser = app.zen_browser.zen
# Créer un launcher personnalisé pour rofi

# Environment variables

# env = XCURSOR_THEME,Vimix-cursors
env = XCURSOR_THEME,macOs
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = LIBVA_DRIVER_NAME,i965

# Theme
source = ~/.config/hypr/themes/current_theme.conf

# Sources
source = ~/dotfiles/.config/hypr/configs/monitors.conf
source = ~/dotfiles/.config/hypr/configs/keybinds.conf
source = ~/dotfiles/.config/hypr/configs/windowrules.conf
source = ~/dotfiles/.config/hypr/configs/execs.conf
source = ~/dotfiles/.config/hypr/configs/settings.conf

# Dark theme for apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"   # for GTK3 apps

exec-once = hyprctl setcursor macOS 24
