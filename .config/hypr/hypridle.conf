# Mise en veille
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = sleep 2.5 && hyprctl dispatch dpms on && sleep 3 && pkill -RTMIN+8 waybar
}

# Fermeture du capot
listener {
    event = sw-lid-close
    on-event = hyprctl dispatch dpms off && loginctl lock-session
}

# Ouverture du capot
listener {
  event = sw-lid-open
  on-event = sleep 2.5 && hyprctl dispatch dpms on && sleep 3 && pkill -RTMIN+8 waybar
}

# Lock after 5 min
listener {
    timeout = 300                                # 5 minutes
    on-timeout = loginctl lock-session           # verrouille la session
}

# Lock screen after 5 min 30 s
listener {
    timeout = 330                                # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off       # éteint l'écran
    on-resume = hyprctl dispatch dpms on         # rallume l'écran au retour
}
