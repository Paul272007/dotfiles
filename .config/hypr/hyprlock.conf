# --- CONFIGURATION GÉNÉRALE ---
general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

# --- FOND D'ÉCRAN (Flou du wallpaper actuel) ---
background {
    monitor =
    path = ~/.cache/current_wallpaper.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3 # 0 pour désactiver le flou
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- L'HORLOGE (Heure) ---
label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 120
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
}

# --- CHAMP DE SAISIE (Password Input) ---
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 1.0) # Ton bleu accent
    inner_color = rgba(40, 40, 40, 0.5)    # Fond sombre transparent
    font_color = rgb(210, 210, 210)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
