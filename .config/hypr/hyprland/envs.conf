# Environment variables

env = XCURSOR_THEME,macOs
env = XCURSOR_SIZE,26
env = HYPRCURSOR_SIZE,26
# env = XDG_CURRENT_DESKTOP,Hyprland
# env = XDG_SESSION_TYPE,wayland
# env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_THEME,adw-gtk3-dark
env = COLOR_THEME,prefer-dark

# Forcer les applications Qt à utiliser Wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# Dis à Qt d'utiliser le style système ou un moteur de thème comme kvantum
env = QT_QPA_PLATFORMTHEME,qt5ct

# Forcer les applications Mozilla (Firefox, Zen Browser) sur Wayland
env = MOZ_ENABLE_WAYLAND,1
