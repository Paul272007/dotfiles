# exec-once = systemctl --user start hyprpolkitagent
# exec-once = nm-applet --indicator

exec-once = quickshell

# TODO : replace hypridle, aww, hyprshade, rofi and swaync with quickshell
exec-once = hypridle
exec-once = awww-daemon
exec-once = swaync
exec-once = hyprshade auto
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = xfce-power-manager

exec-once = hyprctl setcursor macOS 26

# Dark theme for apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = gsettings set org.gnome.desktop.interface gtk-theme "Granite"   # for GTK3 apps

exec-once = ~/.config/hypr/scripts/themeswitch.sh $theme
exec-once = $terminal
exec-once = tmux new-session -d -s main
