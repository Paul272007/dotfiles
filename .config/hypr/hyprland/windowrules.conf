windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
  name = blueman

  match:class = ^(nm-connection-editor|blueman-manager)$

  float = true
  center = true
  size = 800 500
}

# Blur rofi
# windowrule = blur, rofi
# windowapply layerrule ignorealpha 0.5, rofi

layerrule {
    name = swaync_blur
    match:namespace = ^(swaync-notification-window|swaync-control-center|jetbrains-toolbox)$
    blur = true
    ignore_alpha = 0.5
}

windowrule = float 1, match:class org.nmrs.ui

