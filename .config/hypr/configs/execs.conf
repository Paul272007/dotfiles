# exec-once = nm-applet --indicator

# useless because it is run by themeswitch
# exec-once = waybar

exec-once = swww-daemon
exec-once = swaync
exec-once = redshift -c ~/.config/redshift/redshift.confexec-once = redshift -c ~/.config/redshift/redshift.conf
exec-once = ~/.config/hypr/scripts/themeswitch.sh $theme
exec-once = hyprshade on blue-light-filter

exec-once = hyprctl setcursor macOS 24

# Dark theme for apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"   # for GTK3 apps

exec-once = $terminal
exec-once = tmux new-session -d -s main
